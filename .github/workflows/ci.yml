name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Runtime integrity
        run: npm run check:runtime

      - name: Pricing engine tests
        run: npm run test:pricing

      - name: Offer lifecycle tests
        run: npm run test:lifecycle

      - name: Charter source ingestion tests
        run: npm run test:sources

      - name: Telegram integration tests
        run: npm run test:telegram

      - name: Admin authentication tests
        run: npm run test:admin-auth

      - name: Telegram publisher tests
        run: npm run test:publisher

      - name: Sync concurrency and persistence tests
        run: npm run test:sync

      - name: Server API regression tests
        run: npm run test:server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Sites worker tests
        run: npm run test:sites

      - name: Install browser for UI and mobile runtime tests
        run: npx playwright install --with-deps chromium

      - name: Client browser regression tests
        run: npm test

      - name: Mobile runtime browser tests
        run: npm run test:runtime
