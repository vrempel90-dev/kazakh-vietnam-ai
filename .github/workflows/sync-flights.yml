name: Sync charter flights

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: charter-flight-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync public flight sources
        run: npm run sync:flights

      - name: Commit updated feed
        shell: bash
        run: |
          if git diff --quiet -- public/flights.json; then
            echo "No flight changes"
            exit 0
          fi
          git config user.name "charter-flight-sync"
          git config user.email "actions@users.noreply.github.com"
          git add public/flights.json
          git commit -m "data: refresh charter flight feed"
          git push
