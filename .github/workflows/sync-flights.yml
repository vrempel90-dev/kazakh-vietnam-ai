name: Sync charter flights

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charter-flight-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_SOURCE_CHANNELS: ${{ vars.TELEGRAM_SOURCE_CHANNELS }}
      TELEGRAM_SOURCE_TTL_HOURS: ${{ vars.TELEGRAM_SOURCE_TTL_HOURS }}
      TELEGRAM_SOURCE_MAX_PAGES: ${{ vars.TELEGRAM_SOURCE_MAX_PAGES }}
      SALE_PRICE_ROUNDING: ${{ vars.SALE_PRICE_ROUNDING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync public Telegram charter channels
        run: npm run sync:flights

      - name: Commit updated customer feed
        shell: bash
        run: |
          if git diff --quiet -- public/flights.json; then
            echo "No customer-visible flight changes"
            exit 0
          fi
          git config user.name "charter-flight-sync"
          git config user.email "actions@users.noreply.github.com"
          git add public/flights.json
          git commit -m "data: refresh Telegram charter flight feed"
          git push
