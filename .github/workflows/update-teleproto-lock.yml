name: Update teleproto lock

on:
  push:
    branches:
      - feat/large-telegram-channel-discovery
    paths:
      - package.json
      - .github/workflows/update-teleproto-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/large-telegram-channel-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore: update package lock for teleproto"
            git push origin HEAD:feat/large-telegram-channel-discovery
          fi
