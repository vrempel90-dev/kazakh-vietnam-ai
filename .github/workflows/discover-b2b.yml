name: Discover B2B sources

on:
  push:
    branches: [feature/all-charter-sources]
    paths:
      - "scripts/diagnose-b2b.mjs"
      - ".github/workflows/discover-b2b.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-b2b.mjs
